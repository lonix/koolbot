# Path-based labels for pull requests, applied by .github/workflows/auto-label.yml
# (actions/labeler). Labels are only ever ADDED — sync-labels is off, so a label a
# maintainer removes by hand stays removed. Type labels (bug, enhancement, ...) and
# the release-impact labels (major/minor/patch) are derived from the Conventional
# Commit PR title in the same workflow, not from paths.
#
# Every label named here is also declared in the LABELS catalogue of the workflow so
# it is created with a consistent colour/description if it does not exist yet.

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '.markdownlint.json'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/actions/**'
          - '.github/dependabot.yml'
          - '.github/zizmor.yml'
          - '.github/labeler.yml'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'Dockerfile'
          - 'Dockerfile.*'
          - 'docker-compose*.yml'
          - '.dockerignore'
          - '.hadolint.yaml'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '__tests__/**'
          - 'jest.config.*'
          - 'TESTING.md'

