name: Docker Build and Push

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  # Weekly rebuild so a quiet main still picks up refreshed base images and
  # the Trivy scan sees newly published advisories (#963).
  schedule:
    - cron: '17 4 * * 1'
  # Opt-in preview images for same-repo PRs carrying the `docker-preview`
  # label (#1094): adding the label or pushing to a labelled PR builds
  # ghcr.io/<repo>:pr-<number>; closing the PR deletes its preview tags.
  # Fork PRs never build — their GITHUB_TOKEN cannot push to GHCR, and this
  # must NOT move to `pull_request_target` to work around that (it would run
  # untrusted code with a write token).
  pull_request:
    types: [labeled, synchronize, reopened, closed]

# Cancel in-progress runs for the same workflow and ref (except on tags).
# A pull_request event that neither builds a preview nor cleans one up (an
# unrelated label, an unlabelled PR, a fork) gets a group of its own, so it
# cannot cancel a preview build that is still running for the same PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      github.event_name == 'pull_request' && !(
        github.event.pull_request.head.repo.full_name == github.repository && (
          github.event.action == 'closed' ||
          (github.event.action == 'labeled' && github.event.label.name == 'docker-preview' &&
            github.event.pull_request.state == 'open') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'docker-preview'))
        )
      ) && format('-skip-{0}', github.run_id) || ''
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    # On pull_request, only build for a same-repo PR that carries the
    # `docker-preview` label: when it is added, and on later pushes or a
    # reopen while it is still there. build-and-push `needs` this job, so it
    # is skipped whenever this one is.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository && (
          (github.event.action == 'labeled' && github.event.label.name == 'docker-preview' &&
            github.event.pull_request.state == 'open') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'docker-preview'))
        )
      )
    timeout-minutes: 5
    permissions:
      contents: read
      # Required for uploading the hadolint SARIF report to the Security tab.
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  build-and-push:
    name: Build, scan, sign and push
    runs-on: ubuntu-latest
    needs: hadolint
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing and SLSA provenance attestations.
      id-token: write
      attestations: write
      # Required for uploading the Trivy SARIF report to the Security tab.
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Previews build the PR head itself rather than the merge ref, so
          # the image matches the commit its tag names. Empty (the default
          # ref) for every other event.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Previews are linux/amd64 only; QEMU is just for the arm64 release leg.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          # Emit OCI annotations on both the per-platform manifests and the
          # image index. GHCR reads the package description from the index
          # annotation for multi-arch images, so "index" is required for the
          # description to show up on the GitHub Packages page.
          # Previews are single-platform images with no index, so they only
          # get manifest-level annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ github.event_name == 'pull_request' && 'manifest' || 'manifest,index' }}
          # Name the PR head commit in preview tags, not the merge commit.
          DOCKER_METADATA_PR_HEAD_SHA: ${{ github.event_name == 'pull_request' }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=pr-${{ github.event.pull_request.number }}-sha-,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=koolbot
            org.opencontainers.image.description=A Discord bot with various features
            maintainer=lonix
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # metadata-action builds the annotations output from the
          # `annotations` input (not `labels`), so the custom description must
          # be repeated here to land in steps.meta.outputs.annotations — which
          # is what gets attached to the manifest index and read by GHCR.
          annotations: |
            org.opencontainers.image.title=koolbot
            org.opencontainers.image.description=A Discord bot with various features
            maintainer=lonix
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          # Always pull the latest node:24-alpine base layers instead of
          # reusing a cached digest. The Node team rebuilds the Alpine base
          # whenever Alpine ships security updates, so pulling fresh is how the
          # image absorbs patched system OpenSSL (libssl3/libcrypto3) — e.g. the
          # High PKCS7_verify use-after-free (#57/#72). Without this, the gha
          # build cache could reuse a stale base and a rebuild on main would
          # never pick up the fix.
          pull: true
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance, SBOM, attestation, signing and the Trivy scan are
          # release concerns; previews skip them to stay fast and cheap.
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Generate SLSA build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign published image with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Run Trivy vulnerability scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # trivy-action ignores `severity` for SARIF output unless this is
          # set, which let Medium findings through to the Security tab (#963).
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  preview-comment:
    name: Post preview pull command
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5
    # build-and-push only runs on pull_request for a labelled same-repo PR.
    if: github.event_name == 'pull_request'
    permissions:
      # Create or update the sticky preview comment on the PR.
      pull-requests: write
    steps:
      - name: Create or update the preview comment
        uses: actions/github-script@v9.0.0
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const number = context.issue.number;
            const image = process.env.IMAGE.toLowerCase();
            const digest = process.env.DIGEST;
            // metadata-action's short SHA is the first 7 characters.
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const tag = `pr-${number}`;
            const pinned = `${tag}-sha-${sha}`;
            const body = [
              MARKER,
              '### 🐳 Docker preview ready',
              '',
              `Built from ${sha} ([run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
              '',
              'Latest build of this PR:',
              '',
              '```bash',
              `docker pull ${image}:${tag}`,
              '```',
              '',
              'This exact commit:',
              '',
              '```bash',
              `docker pull ${image}:${pinned}`,
              '```',
              '',
              `Digest: \`${digest}\``,
              '',
              '> Run it with its own Discord application/token, a test guild and a throwaway MongoDB, never production.',
              '> This comment is updated on every rebuild. The images are deleted when the PR is closed.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }

  cleanup-preview:
    name: Delete PR preview image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on every same-repo PR close, labelled or not, so tags left behind
    # after the label was removed are still cleaned up. A PR with no preview
    # simply matches nothing.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Deleting a package version also needs the repository to hold the Admin
      # role on the package (package settings -> Manage Actions access).
      packages: write
      # Mark the sticky preview comment as removed.
      pull-requests: write
    steps:
      - name: Delete pr-<number> image versions
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prefix = `pr-${process.env.PR_NUMBER}`;
            const isPreviewTag = (t) => t === prefix || t.startsWith(`${prefix}-`);
            const owner = context.repo.owner;
            const isOrg = context.payload.repository.owner.type === 'Organization';
            const base = {
              package_type: 'container',
              package_name: context.repo.repo.toLowerCase(),
              ...(isOrg ? { org: owner } : { username: owner }),
            };
            const list = isOrg
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const remove = isOrg
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;

            const versions = await github.paginate(list, { ...base, state: 'active', per_page: 100 });
            // Only delete a version whose every tag belongs to this PR's
            // preview, so an image that also carries a release tag is never
            // touched.
            const previews = versions.filter((v) => {
              const tags = v.metadata?.container?.tags ?? [];
              return tags.length > 0 && tags.every(isPreviewTag);
            });
            if (!previews.length) {
              core.info(`No ${prefix} preview images to delete.`);
              return;
            }
            for (const v of previews) {
              core.info(`Deleting ${v.name} [${v.metadata.container.tags.join(', ')}]`);
              await remove({ ...base, package_version_id: v.id });
            }

      - name: Mark the preview comment as removed
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (!existing) return;
            const body = [
              MARKER,
              '### 🐳 Docker preview removed',
              '',
              `The pr-${context.issue.number} preview images were deleted when this PR was closed.`,
              'Reopen the PR (with the `docker-preview` label still on) to build a new one.',
            ].join('\n');
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
