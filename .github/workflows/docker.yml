name: Docker Build and Push

# Image tags (#1278):
#   v*.*.* tag push -> latest, X.Y.Z, X.Y, X (+ sha-<short>)
#   nightly main    -> nightly, main, sha-<short>   (never latest)
#   PR preview      -> pr-<number>, pr-<number>-sha-<short>
# A merge to main does not build; the nightly run and the release tag do.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  # Nightly build of main on a freshly pulled base image, so a quiet main still
  # picks up refreshed base images and the Trivy scan sees newly published
  # advisories (#963). Release images get base-image fixes at the next release.
  schedule:
    - cron: '17 3 * * *'
  # Opt-in preview images for same-repo PRs carrying the `docker-preview`
  # label (#1094): adding the label or pushing to a labelled PR builds
  # ghcr.io/<repo>:pr-<number>; closing the PR deletes its preview tags.
  # Fork PRs never build — their GITHUB_TOKEN cannot push to GHCR, and this
  # must NOT move to `pull_request_target` to work around that (it would run
  # untrusted code with a write token).
  pull_request:
    types: [labeled, synchronize, reopened, closed]

# Only PR previews are ever cancelled in progress. A schedule, dispatch or tag
# run that has pushed an image must always reach cosign signing, so those runs
# queue instead (a newer pending run replaces an older pending one for the same
# ref).
# pull_request events are keyed by PR number instead: on a merged PR's
# `closed` event github.ref is the base branch, which would put cleanup in the
# same group as the release build on main. A pull_request event that neither
# builds a preview nor cleans one up (an unrelated label, an unlabelled PR, a
# fork) gets a group of its own, so it cannot cancel a preview build that is
# still running for the same PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref
    }}${{
      github.event_name == 'pull_request' && !(
        github.event.pull_request.head.repo.full_name == github.repository && (
          github.event.action == 'closed' ||
          (github.event.action == 'labeled' && github.event.label.name == 'docker-preview' &&
            github.event.pull_request.state == 'open') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'docker-preview'))
        )
      ) && format('-skip-{0}', github.run_id) || ''
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    # On pull_request, only build for a same-repo PR that carries the
    # `docker-preview` label: when it is added, and on later pushes or a
    # reopen while it is still there. build-and-push `needs` this job, so it
    # is skipped whenever this one is.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository && (
          (github.event.action == 'labeled' && github.event.label.name == 'docker-preview' &&
            github.event.pull_request.state == 'open') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'docker-preview'))
        )
      )
    timeout-minutes: 5
    permissions:
      contents: read
      # Required for uploading the hadolint SARIF report to the Security tab.
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          # Gate the push on real Dockerfile errors (#1154). Warnings and
          # info findings still reach the Security tab through the SARIF
          # upload below but do not block a release.
          failure-threshold: error

      - name: Upload hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # Build the image locally and scan THAT before anything is pushed (#1154):
  # a vulnerable image must never reach GHCR. Release concern only, previews
  # skip it like they skip attestation and signing. A local `load: true` build
  # cannot be multi-platform, so the gate scans the linux/amd64 image; the
  # arm64 leg is built in the push job from the same base digest, Dockerfile
  # and lockfile but is not scanned itself.
  scan-image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: hadolint
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    outputs:
      base-image: ${{ steps.base.outputs.ref }}
    permissions:
      contents: read
      # Required for uploading the Trivy SARIF report to the Security tab.
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Resolve the mutable base tag to an immutable index digest ONCE, and
      # hand the same reference to the scan build and the push build, so a
      # base image republished between the two jobs cannot make the pushed
      # image differ from the scanned one. The index digest covers both
      # platforms, so the arm64 leg uses the same base release too.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect node:24-alpine --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: ${digest}" >&2; exit 1; }
          echo "ref=node:24-alpine@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          # Same fresh-base rule as the push build below.
          pull: true
          platforms: linux/amd64
          build-args: NODE_IMAGE=${{ steps.base.outputs.ref }}
          tags: koolbot-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image loaded into the local daemon cannot carry attestations.
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: koolbot-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          # CRITICAL only, and only findings that have a fix available, so
          # the gate fails on things the maintainers can act on (#1154).
          severity: CRITICAL
          # trivy-action ignores `severity` for SARIF output unless this is
          # set, which let Medium findings through to the Security tab (#963).
          limit-severities-for-sarif: true
          ignore-unfixed: true
          # Non-zero exit fails this job, which blocks build-and-push, the
          # attestation and the signature. The SARIF file is still written
          # and uploaded below.
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [hadolint, scan-image]
    timeout-minutes: 30
    # scan-image is skipped on pull_request (previews are not scanned), and a
    # skipped dependency would skip this job too, so the gate is spelled out:
    # hadolint must have passed, and the scan must have passed or been skipped
    # (never failed or cancelled).
    if: >-
      !cancelled() && needs.hadolint.result == 'success' &&
      (needs.scan-image.result == 'success' || needs.scan-image.result == 'skipped')
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      # When the push finished (UTC), shown in the preview comment. Only set
      # on pull_request.
      built-at: ${{ steps.built-at.outputs.time }}
    # Previews run this job too, so it only gets what a push needs. The
    # release-only grants live on attest-and-sign, which previews never reach.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Previews build the PR head itself rather than the merge ref, so
          # the image matches the commit its tag names. Empty (the default
          # ref) for every other event.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Previews are linux/amd64 only; QEMU is just for the arm64 release leg.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Emit OCI annotations on both the per-platform manifests and the
          # image index. GHCR reads the package description from the index
          # annotation for multi-arch images, so "index" is required for the
          # description to show up on the GitHub Packages page.
          # Previews are single-platform images with no index, so they only
          # get manifest-level annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ github.event_name == 'pull_request' && 'manifest' || 'manifest,index' }}
          # Name the PR head commit in preview tags, not the merge commit.
          DOCKER_METADATA_PR_HEAD_SHA: ${{ github.event_name == 'pull_request' }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A tag build publishes only its own X.Y.Z. `latest`, X.Y and X are
          # moved by the `promote` job, which decides freshness in a serialized
          # step, so no build can roll them back. Nightly and branch builds
          # never get `latest`; they get `nightly` (default branch only) and
          # `main`.
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=pr-${{ github.event.pull_request.number }}-sha-,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=koolbot
            org.opencontainers.image.description=A Discord bot with various features
            maintainer=lonix
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # metadata-action builds the annotations output from the
          # `annotations` input (not `labels`), so the custom description must
          # be repeated here to land in steps.meta.outputs.annotations — which
          # is what gets attached to the manifest index and read by GHCR.
          annotations: |
            org.opencontainers.image.title=koolbot
            org.opencontainers.image.description=A Discord bot with various features
            maintainer=lonix
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Always pull the latest node:24-alpine base layers instead of
          # reusing a cached digest. The Node team rebuilds the Alpine base
          # whenever Alpine ships security updates, so pulling fresh is how the
          # image absorbs patched system OpenSSL (libssl3/libcrypto3) — e.g. the
          # High PKCS7_verify use-after-free (#57/#72). Without this, the gha
          # build cache could reuse a stale base and the nightly rebuild would
          # never pick up the fix.
          pull: true
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Release builds reuse the digest-pinned base the scan job resolved;
          # previews (no scan) keep the Dockerfile default tag.
          build-args: ${{ needs.scan-image.outputs.base-image && format('NODE_IMAGE={0}', needs.scan-image.outputs.base-image) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance and SBOM (like attest-and-sign) are release concerns;
          # previews skip them to stay fast and cheap.
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Record the build time
        id: built-at
        if: github.event_name == 'pull_request'
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

  attest-and-sign:
    name: Attest and sign
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    # Release concern only: preview images are not attested or signed. The
    # image was already scanned (scan-image) before it was pushed.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      # Push the attestation and cosign signature next to the image.
      packages: write
      # Required for cosign keyless signing and SLSA provenance attestations.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image with cosign (keyless)
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # Moves latest, X.Y and X to the newest release (tag builds only). The
  # version image above is already pushed and signed; this job only adds tags
  # to that digest, and a failure here leaves it published and signed.
  #
  # All promote runs share ONE group and never cancel, so they run one at a
  # time. GitHub keeps only one PENDING run per group and drops older pending
  # ones, which is harmless here: every run resolves the newest release itself
  # and promotes THAT release's image, never this run's own tag, so whichever
  # run goes last (even a re-run of an older tag) leaves the aliases on the
  # newest release. Version builds are not in this group, so they cannot be
  # dropped.
  #
  # No re-sign is needed: the cosign signature and attestations are stored by
  # image digest, and the aliases point at that same digest, so
  # `cosign verify <image>:latest` finds the signature made in
  # attest-and-sign. (imagetools copies a single source index unchanged, so the
  # digest should stay identical; not yet confirmed on a real run.)
  #
  # `needs: attest-and-sign` only covers THIS run's image, but the newest
  # release may be a different run whose signing is still in progress or has
  # failed. So the job resolves that release's image to a digest, runs
  # `cosign verify` on the digest, and promotes that same digest only if the
  # signature checks out. If it does not (for example the newest release is
  # still signing), the job fails without moving any alias, and the newest
  # release's own promote, which runs after its attest-and-sign, sets them.
  promote:
    name: Promote release aliases
    runs-on: ubuntu-latest
    needs: attest-and-sign
    timeout-minutes: 10
    # A pre-release tag (v1.2.3-rc.1) never promotes. It is kept out of the
    # shared group as well as skipped: GitHub keeps one pending run per group,
    # and an ineligible run must not displace a pending stable promote. The
    # step below keeps the strict vX.Y.Z regex as a second guard.
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    concurrency:
      group: >-
        ${{ github.workflow }}-promote${{
          contains(github.ref_name, '-') && format('-skip-{0}', github.run_id) || ''
        }}
      cancel-in-progress: false
    permissions:
      # contents: read is for the releases lookup (a private repo needs it).
      # packages: write adds the alias tags; cosign verify only reads. No
      # id-token: nothing is signed here.
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Point latest, X.Y and X at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stable='^v([0-9]+)\.([0-9]+)\.[0-9]+$'
          # Only a real release tag triggers promotion; a pre-release tag
          # never moves the aliases.
          if [[ ! "${TRIGGER_TAG}" =~ ${stable} ]]; then
            echo "::notice::${TRIGGER_TAG} is not a stable release tag; nothing to promote."
            exit 0
          fi
          newest="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          [[ "${newest}" =~ ${stable} ]] || { echo "unexpected release tag: ${newest}" >&2; exit 1; }
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          image="${IMAGE,,}"
          version="${newest#v}"
          echo "Newest release is ${newest} (this run: ${TRIGGER_TAG}); resolving ${image}:${version}."
          digest="$(docker buildx imagetools inspect "${image}:${version}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: ${digest}" >&2; exit 1; }
          # Only an image signed by this repo's docker.yml on a release tag
          # may be promoted. Regex metacharacters in the repo name are escaped.
          repo_re="$(printf '%s' "${REPO}" | sed -E 's/[]\\.*+?^${}()|[-]/\\&/g')"
          if ! cosign verify \
            --certificate-identity-regexp "^https://github\.com/${repo_re}/\.github/workflows/docker\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${image}@${digest}" > /dev/null; then
            echo "::error::${newest} (${image}@${digest}) has no valid cosign signature yet, so no alias was moved. Its own promote run sets them once its signing succeeds; re-run that tag's workflow if signing failed." >&2
            exit 1
          fi
          echo "Verified ${image}@${digest}; promoting it."
          docker buildx imagetools create \
            --tag "${image}:latest" --tag "${image}:${major}.${minor}" --tag "${image}:${major}" \
            "${image}@${digest}"

  preview-comment:
    name: Post preview pull command
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5
    # build-and-push only runs on pull_request for a labelled same-repo PR.
    # scan-image (an ancestor of build-and-push) is skipped on pull_request, and
    # an `if` without a status function implies success(), which is false when
    # any ancestor was skipped, so this job would be skipped even though the
    # preview was built. The explicit condition mirrors build-and-push.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.build-and-push.result == 'success'
    permissions:
      # Create or update the sticky preview comment on the PR.
      pull-requests: write
    steps:
      - name: Create or update the preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          BUILT_AT: ${{ needs.build-and-push.outputs.built-at }}
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const number = context.issue.number;
            const image = process.env.IMAGE.toLowerCase();
            const digest = process.env.DIGEST;
            // The commit the image was built from: build-and-push checks out
            // this exact head SHA. metadata-action's short SHA is its first 7
            // characters.
            const fullSha = context.payload.pull_request.head.sha;
            const sha = fullSha.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${fullSha}`;
            // `2026-10-20T10:02:03Z` -> `2026-10-20 10:02:03 UTC`
            const builtAt = (process.env.BUILT_AT || new Date().toISOString().slice(0, 19) + 'Z')
              .replace('T', ' ').replace('Z', ' UTC');
            // Shared with the preview-outdated job (keep the two copies identical):
            // rewrite a comment body into its outdated / ready form. Both strip
            // an earlier notice first, so they are idempotent.
            const NOTICE = /<!-- docker-preview-outdated -->[\s\S]*?<!-- \/docker-preview-outdated -->\n\n?/;
            const markReady = (text) => text.replace(NOTICE, '').replace(/^### .*$/m, '### 🐳 Docker preview ready');
            const markOutdated = (text, head, built, why, runUrl) => {
              const commitUrl = (h) => `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${h}`;
              const notice = [
                '<!-- docker-preview-outdated -->',
                '> [!WARNING]',
                `> **Outdated.** The PR head is now [\`${head.slice(0, 7)}\`](${commitUrl(head)}), but the image below was built from ` +
                  `[\`${built.slice(0, 7)}\`](${commitUrl(built)}). ${why} ([run](${runUrl})).`,
                '<!-- /docker-preview-outdated -->',
                '',
              ].join('\n');
              return text.replace(NOTICE, '')
                .replace(/^### .*$/m, '### 🐳 Docker preview outdated')
                .replace(/^(### .*\n\n)/m, `$1${notice}\n`);
            };
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tag = `pr-${number}`;
            const pinned = `${tag}-sha-${sha}`;
            const ready = [
              MARKER,
              // Machine-readable: the preview-outdated job compares this with the
              // PR head. Keep it on line 2.
              `<!-- docker-preview-commit: ${fullSha} -->`,
              '### 🐳 Docker preview ready',
              '',
              `Built from [\`${sha}\`](${commitUrl}) at ${builtAt} ([run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
              '',
              'Latest build of this PR:',
              '',
              '```bash',
              `docker pull ${image}:${tag}`,
              '```',
              '',
              'This exact commit:',
              '',
              '```bash',
              `docker pull ${image}:${pinned}`,
              '```',
              '',
              `Digest: \`${digest}\``,
              '',
              '> Run it with its own Discord application/token, a test guild and a throwaway MongoDB, never production.',
              '> This comment is updated on every rebuild, and marked outdated when a push to the PR is not built. The images are deleted when the PR is closed.',
            ].join('\n');

            // The PR may have moved while this image was building (a push that
            // was not built, e.g. after the label was removed, gets its own
            // run). Re-read the head just before writing so this writer and
            // preview-outdated end in the same state whatever the order.
            const { data: live } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const body = live.head.sha === fullSha
              ? ready
              : markOutdated(ready, live.head.sha, fullSha, 'A newer commit was pushed while this image was building', runUrl);

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }

  # Marks the sticky preview comment outdated when the PR head has moved on
  # without a new build (#1308). preview-comment rewrites the comment on every
  # successful build; this covers the pull_request runs that ran but did not
  # build: label removed (hadolint skipped), build skipped or failed. It only
  # edits an existing comment, and only when that comment's commit marker
  # differs from the current head. Not covered: events that start no run (a push
  # made with GITHUB_TOKEN, a PR with merge conflicts, removing the label with
  # no later push) and fork PRs, which never get a preview comment.
  preview-outdated:
    name: Mark preview outdated
    runs-on: ubuntu-latest
    # hadolint is listed too: when it fails, build-and-push is skipped (not
    # failed), and the notice should still say the build failed.
    needs: [hadolint, build-and-push]
    timeout-minutes: 5
    # `!cancelled()` so a skipped or failed build still reaches this job; a run
    # cancelled by a newer push does not (that push's run takes over). An
    # unrelated label does not move the head, so it is left out.
    if: >-
      !cancelled() && needs.build-and-push.result != 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && (
        github.event.action == 'synchronize' || github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'docker-preview')
      )
    permissions:
      # Edit the sticky preview comment.
      pull-requests: write
    steps:
      - name: Mark the preview comment outdated
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ (needs.hadolint.result == 'failure' || needs.build-and-push.result == 'failure') && 'failure' || 'not-built' }}
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const number = context.issue.number;
            const head = context.payload.pull_request.head.sha;
            // Shared with the preview-outdated job (keep the two copies identical):
            // rewrite a comment body into its outdated / ready form. Both strip
            // an earlier notice first, so they are idempotent.
            const NOTICE = /<!-- docker-preview-outdated -->[\s\S]*?<!-- \/docker-preview-outdated -->\n\n?/;
            const markReady = (text) => text.replace(NOTICE, '').replace(/^### .*$/m, '### 🐳 Docker preview ready');
            const markOutdated = (text, head, built, why, runUrl) => {
              const commitUrl = (h) => `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${h}`;
              const notice = [
                '<!-- docker-preview-outdated -->',
                '> [!WARNING]',
                `> **Outdated.** The PR head is now [\`${head.slice(0, 7)}\`](${commitUrl(head)}), but the image below was built from ` +
                  `[\`${built.slice(0, 7)}\`](${commitUrl(built)}). ${why} ([run](${runUrl})).`,
                '<!-- /docker-preview-outdated -->',
                '',
              ].join('\n');
              return text.replace(NOTICE, '')
                .replace(/^### .*$/m, '### 🐳 Docker preview outdated')
                .replace(/^(### .*\n\n)/m, `$1${notice}\n`);
            };
            // A newer push is already in flight: its run owns the comment.
            const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (current.head.sha !== head) {
              core.info('The PR head moved again; leaving the comment to the newer run.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            // No comment, or the "removed" one (no commit marker): nothing to mark.
            const built = existing?.body.match(/<!-- docker-preview-commit: ([0-9a-f]{40}) -->/)?.[1];
            if (!built) {
              core.info('No built preview comment to mark.');
              return;
            }
            // Narrow the read-modify-write: another writer (a build finishing)
            // may have rewritten the comment since the list above. If its
            // commit marker changed, that writer compared the head itself, so
            // leave it alone. Not a lock: a write landing between this read and
            // the update below can still be overwritten (see the PR notes).
            const { data: fresh } = await github.rest.issues.getComment({ ...context.repo, comment_id: existing.id });
            if (fresh.body.match(/<!-- docker-preview-commit: ([0-9a-f]{40}) -->/)?.[1] !== built) {
              core.info('The preview comment changed while this job ran; leaving it to that writer.');
              return;
            }
            existing.body = fresh.body;
            if (built === head) {
              // The head is back on the built commit (e.g. a force-push), so an
              // earlier outdated notice no longer applies.
              if (NOTICE.test(existing.body)) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: markReady(existing.body) });
                core.info('The preview matches the PR head again; removed the outdated notice.');
              } else {
                core.info('The preview already matches the PR head.');
              }
              return;
            }
            const why = process.env.BUILD_RESULT === 'failure'
              ? 'The build for the new head failed'
              : 'No build ran for the new head (the `docker-preview` label may be missing, or the build was skipped)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              ...context.repo, comment_id: existing.id, body: markOutdated(existing.body, head, built, why, runUrl),
            });

  cleanup-preview:
    name: Delete PR preview image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on every same-repo PR close, labelled or not, so tags left behind
    # after the label was removed are still cleaned up. A PR with no preview
    # simply matches nothing.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Deleting a package version also needs the repository to hold the Admin
      # role on the package (package settings -> Manage Actions access).
      packages: write
      # Mark the sticky preview comment as removed, and drop the docker-preview
      # label from a merged release PR.
      pull-requests: write
    steps:
      - name: Delete pr-<number> image versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prefix = `pr-${process.env.PR_NUMBER}`;
            const isPreviewTag = (t) => t === prefix || t.startsWith(`${prefix}-`);
            const owner = context.repo.owner;
            const isOrg = context.payload.repository.owner.type === 'Organization';
            const base = {
              package_type: 'container',
              package_name: context.repo.repo.toLowerCase(),
              ...(isOrg ? { org: owner } : { username: owner }),
            };
            const list = isOrg
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const remove = isOrg
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;

            const versions = await github.paginate(list, { ...base, state: 'active', per_page: 100 });
            // Only delete a version whose every tag belongs to this PR's
            // preview, so an image that also carries a release tag is never
            // touched.
            const previews = versions.filter((v) => {
              const tags = v.metadata?.container?.tags ?? [];
              return tags.length > 0 && tags.every(isPreviewTag);
            });
            if (!previews.length) {
              core.info(`No ${prefix} preview images to delete.`);
              return;
            }
            for (const v of previews) {
              core.info(`Deleting ${v.name} [${v.metadata.container.tags.join(', ')}]`);
              await remove({ ...base, package_version_id: v.id });
            }

      - name: Mark the preview comment as removed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (!existing) return;
            const body = [
              MARKER,
              '### 🐳 Docker preview removed',
              '',
              `The pr-${context.issue.number} preview images were deleted when this PR was closed.`,
              'Reopen the PR (with the `docker-preview` label still on) to build a new one.',
            ].join('\n');
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });

      # release-please.yml labels its release PR docker-preview. Once that PR is merged
      # the images are gone, so drop the label too, leaving `autorelease: tagged` only.
      # Cosmetic: only a 404 (label already absent) is tolerated, anything else fails
      # this last step. The head ref is only read in `if`, never put into script text.
      - name: Remove docker-preview from a merged release PR
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-please--')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: Number(process.env.PR_NUMBER), name: 'docker-preview',
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('docker-preview label was not on the PR.');
            }
