name: Docker Build and Push

# Image tags (#1278):
#   v*.*.* tag push      -> latest, X.Y.Z, X.Y, X (+ sha-<short>)
#   nightly main build   -> nightly, main, sha-<short>   (never latest)
#   weekly release build -> latest, X.Y.Z, X.Y, X of the NEWEST release,
#                           rebuilt from its tag on a fresh base image
#   PR preview           -> pr-<number>, pr-<number>-sha-<short>
# A merge to main does not build; the nightly run and the release tag do.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      rebuild-release:
        description: Rebuild the newest release (what the weekly run does) instead of main
        type: boolean
        default: false
  # Nightly: builds main HEAD on a freshly pulled base image, which also keeps
  # the Trivy scan current with new advisories (#963).
  # Weekly (Mondays): rebuilds the newest release tag on a fresh base image so
  # `latest` picks up base-image fixes between releases. The plan job below
  # recognises this run by its exact cron string, so keep the two in sync.
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 3 * * 1'
  # Opt-in preview images for same-repo PRs carrying the `docker-preview`
  # label (#1094): adding the label or pushing to a labelled PR builds
  # ghcr.io/<repo>:pr-<number>; closing the PR deletes its preview tags.
  # Fork PRs never build — their GITHUB_TOKEN cannot push to GHCR, and this
  # must NOT move to `pull_request_target` to work around that (it would run
  # untrusted code with a write token).
  pull_request:
    types: [labeled, synchronize, reopened, closed]

# Only PR previews are ever cancelled in progress. A schedule, dispatch or tag
# run that has pushed an image must always reach cosign signing, so those runs
# queue instead (a newer pending run replaces an older pending one in the same
# group). The two schedules get their own groups so a nightly never displaces
# the pending weekly release rebuild, or the reverse.
# pull_request events are keyed by PR number instead: on a merged PR's
# `closed` event github.ref is the base branch, which would put cleanup in the
# same group as the release build on main. A pull_request event that neither
# builds a preview nor cleans one up (an unrelated label, an unlabelled PR, a
# fork) gets a group of its own, so it cannot cancel a preview build that is
# still running for the same PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'schedule' && format('schedule-{0}', github.event.schedule) ||
      github.ref
    }}${{
      github.event_name == 'pull_request' && !(
        github.event.pull_request.head.repo.full_name == github.repository && (
          github.event.action == 'closed' ||
          (github.event.action == 'labeled' && github.event.label.name == 'docker-preview' &&
            github.event.pull_request.state == 'open') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'docker-preview'))
        )
      ) && format('-skip-{0}', github.run_id) || ''
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Decides what this run builds and which tags it may publish. Everything it
  # reads from the event goes through env vars, never into the script text.
  # `latest` is only ever enabled here, for a stable vX.Y.Z tag push or for the
  # rebuild of the newest release, so no main, nightly or dispatch build can
  # move it.
  plan:
    name: Plan build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # preview (pull_request), release (rebuild of the newest release) or
      # standard (tag push, nightly, dispatch: build the triggering ref).
      mode: ${{ steps.plan.outputs.mode }}
      # Commit to check out; empty means the event's default ref.
      ref: ${{ steps.plan.outputs.ref }}
      # Release tag to feed metadata-action when rebuilding; empty otherwise.
      tag: ${{ steps.plan.outputs.tag }}
      latest: ${{ steps.plan.outputs.latest }}
      nightly: ${{ steps.plan.outputs.nightly }}
    steps:
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REBUILD_INPUT: ${{ inputs.rebuild-release }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          mode=standard ref='' tag='' latest=false nightly=false

          if [[ "${EVENT_NAME}" == pull_request ]]; then
            mode=preview
          elif [[ "${EVENT_NAME}" == push ]]; then
            # The trigger only matches v*.*.*; a pre-release tag still builds
            # but must not become latest.
            if [[ "${REF_TYPE}" == tag && "${REF_NAME}" =~ ${stable} ]]; then
              latest=true
            fi
          elif [[ ( "${EVENT_NAME}" == schedule && "${SCHEDULE}" == '47 3 * * 1' ) \
               || ( "${EVENT_NAME}" == workflow_dispatch && "${REBUILD_INPUT}" == true ) ]]; then
            tag="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
            [[ "${tag}" =~ ${stable} ]] || { echo "unexpected release tag: ${tag}" >&2; exit 1; }
            ref="$(gh api "repos/${REPO}/commits/${tag}" --jq .sha)"
            [[ "${ref}" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit: ${ref}" >&2; exit 1; }
            mode=release latest=true
          elif [[ -n "${DEFAULT_BRANCH}" && "${REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            nightly=true
          fi

          {
            echo "mode=${mode}"
            echo "ref=${ref}"
            echo "tag=${tag}"
            echo "latest=${latest}"
            echo "nightly=${nightly}"
          } >> "${GITHUB_OUTPUT}"
          echo "Plan: mode=${mode} tag=${tag:-n/a} commit=${ref:-n/a} latest=${latest} nightly=${nightly}"

  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    needs: plan
    # On pull_request, only build for a same-repo PR that carries the
    # `docker-preview` label: when it is added, and on later pushes or a
    # reopen while it is still there. build-and-push `needs` this job, so it
    # is skipped whenever this one is.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository && (
          (github.event.action == 'labeled' && github.event.label.name == 'docker-preview' &&
            github.event.pull_request.state == 'open') ||
          ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'docker-preview'))
        )
      )
    timeout-minutes: 5
    permissions:
      contents: read
      # Required for uploading the hadolint SARIF report to the Security tab.
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release commit for the weekly rebuild, so the gate lints and
          # scans what is about to be pushed; empty (default ref) otherwise.
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          # Gate the push on real Dockerfile errors (#1154). Warnings and
          # info findings still reach the Security tab through the SARIF
          # upload below but do not block a release.
          failure-threshold: error

      - name: Upload hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # Build the image locally and scan THAT before anything is pushed (#1154):
  # a vulnerable image must never reach GHCR. Release concern only, previews
  # skip it like they skip attestation and signing. A local `load: true` build
  # cannot be multi-platform, so the gate scans the linux/amd64 image; the
  # arm64 leg is built in the push job from the same base digest, Dockerfile
  # and lockfile but is not scanned itself.
  scan-image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: [plan, hadolint]
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    outputs:
      base-image: ${{ steps.base.outputs.ref }}
    permissions:
      contents: read
      # Required for uploading the Trivy SARIF report to the Security tab.
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Resolve the mutable base tag to an immutable index digest ONCE, and
      # hand the same reference to the scan build and the push build, so a
      # base image republished between the two jobs cannot make the pushed
      # image differ from the scanned one. The index digest covers both
      # platforms, so the arm64 leg uses the same base release too.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect node:24-alpine --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: ${digest}" >&2; exit 1; }
          echo "ref=node:24-alpine@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          # Same fresh-base rule as the push build below.
          pull: true
          platforms: linux/amd64
          build-args: NODE_IMAGE=${{ steps.base.outputs.ref }}
          tags: koolbot-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image loaded into the local daemon cannot carry attestations.
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: koolbot-scan:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          # CRITICAL only, and only findings that have a fix available, so
          # the gate fails on things the maintainers can act on (#1154).
          severity: CRITICAL
          # trivy-action ignores `severity` for SARIF output unless this is
          # set, which let Medium findings through to the Security tab (#963).
          limit-severities-for-sarif: true
          ignore-unfixed: true
          # Non-zero exit fails this job, which blocks build-and-push, the
          # attestation and the signature. The SARIF file is still written
          # and uploaded below.
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [plan, hadolint, scan-image]
    timeout-minutes: 30
    # scan-image is skipped on pull_request (previews are not scanned), and a
    # skipped dependency would skip this job too, so the gate is spelled out:
    # hadolint must have passed, and the scan must have passed or been skipped
    # (never failed or cancelled).
    if: >-
      !cancelled() && needs.hadolint.result == 'success' &&
      (needs.scan-image.result == 'success' || needs.scan-image.result == 'skipped')
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # Space-separated: the pushed tags, plus the release aliases when the
      # weekly rebuild moved them.
      tags: ${{ steps.meta.outputs.tags }} ${{ steps.aliases.outputs.tags }}
    # Previews run this job too, so it only gets what a push needs. The
    # release-only grants live on attest-and-sign, which previews never reach.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Previews build the PR head itself rather than the merge ref, so
          # the image matches the commit its tag names. The weekly release
          # rebuild builds the release commit instead of main. Empty (the
          # default ref) for every other event.
          ref: ${{ github.event.pull_request.head.sha || needs.plan.outputs.ref }}
          persist-credentials: false

      # Previews are linux/amd64 only; QEMU is just for the arm64 release leg.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Emit OCI annotations on both the per-platform manifests and the
          # image index. GHCR reads the package description from the index
          # annotation for multi-arch images, so "index" is required for the
          # description to show up on the GitHub Packages page.
          # Previews are single-platform images with no index, so they only
          # get manifest-level annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ github.event_name == 'pull_request' && 'manifest' || 'manifest,index' }}
          # Name the PR head commit in preview tags, not the merge commit.
          DOCKER_METADATA_PR_HEAD_SHA: ${{ github.event_name == 'pull_request' }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is switched on only by the plan job (stable tag push or the
          # newest-release rebuild); flavor keeps metadata-action from adding
          # it on its own. The release rebuild builds an old commit, so it must
          # not emit the sha or branch tags that would name the wrong commit,
          # and takes its version from the resolved release tag instead of the
          # (branch) ref. It pushes only X.Y.Z: the shared aliases (latest, X.Y,
          # X) are moved by the "Move release aliases" step after a freshness
          # check. The v0.0.0 is a placeholder the disabled lines never use.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.plan.outputs.latest == 'true' && needs.plan.outputs.mode != 'release' }}
            type=raw,value=nightly,enable=${{ needs.plan.outputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ needs.plan.outputs.mode != 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.plan.outputs.mode != 'release' }}
            type=semver,pattern={{major}},enable=${{ needs.plan.outputs.mode != 'release' }}
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag || 'v0.0.0' }},enable=${{ needs.plan.outputs.mode == 'release' }}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' && needs.plan.outputs.mode != 'release' }}
            type=ref,event=branch,enable=${{ needs.plan.outputs.mode != 'release' }}
            type=ref,event=pr
            type=sha,format=short,prefix=pr-${{ github.event.pull_request.number }}-sha-,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=koolbot
            org.opencontainers.image.description=A Discord bot with various features
            maintainer=lonix
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || needs.plan.outputs.ref || github.sha }}
          # metadata-action builds the annotations output from the
          # `annotations` input (not `labels`), so the custom description must
          # be repeated here to land in steps.meta.outputs.annotations — which
          # is what gets attached to the manifest index and read by GHCR.
          annotations: |
            org.opencontainers.image.title=koolbot
            org.opencontainers.image.description=A Discord bot with various features
            maintainer=lonix
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || needs.plan.outputs.ref || github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Always pull the latest node:24-alpine base layers instead of
          # reusing a cached digest. The Node team rebuilds the Alpine base
          # whenever Alpine ships security updates, so pulling fresh is how the
          # image absorbs patched system OpenSSL (libssl3/libcrypto3) — e.g. the
          # High PKCS7_verify use-after-free (#57/#72). Without this, the gha
          # build cache could reuse a stale base and the nightly and weekly
          # rebuilds would never pick up the fix.
          pull: true
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Release builds reuse the digest-pinned base the scan job resolved;
          # previews (no scan) keep the Dockerfile default tag.
          build-args: ${{ needs.scan-image.outputs.base-image && format('NODE_IMAGE={0}', needs.scan-image.outputs.base-image) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance and SBOM (like attest-and-sign) are release concerns;
          # previews skip them to stay fast and cheap.
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      # Weekly release rebuild only. The build above pushed X.Y.Z; the aliases
      # shared with other release builds move here, seconds before they are
      # used rather than a whole build earlier, and only if the release being
      # rebuilt is still the newest. If a newer release appeared meanwhile, its
      # own tag build owns latest/X.Y/X and this run leaves them alone.
      - name: Move release aliases if still newest
        id: aliases
        if: needs.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLAN_TAG: ${{ needs.plan.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${PLAN_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "unexpected tag: ${PLAN_TAG}" >&2; exit 1; }
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: ${DIGEST}" >&2; exit 1; }
          newest="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          if [[ "${newest}" != "${PLAN_TAG}" ]]; then
            echo "::notice::${newest} is now the newest release; leaving latest, ${major}.${minor} and ${major} to it."
            exit 0
          fi
          # metadata-action lowercased the name; reuse it (the only tag here is X.Y.Z).
          version_ref="${TAGS%%$'\n'*}"
          image="${version_ref%:*}"
          docker buildx imagetools create \
            --tag "${image}:latest" --tag "${image}:${major}.${minor}" --tag "${image}:${major}" \
            "${image}@${DIGEST}"
          echo "tags=${image}:latest ${image}:${major}.${minor} ${image}:${major}" >> "${GITHUB_OUTPUT}"

  attest-and-sign:
    name: Attest and sign
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    # Release concern only: preview images are not attested or signed. The
    # image was already scanned (scan-image) before it was pushed.
    #
    # Known limitation (#1278): the provenance attestation and the keyless
    # cosign certificate describe the workflow run, and a scheduled run is on
    # main. For the weekly release rebuild they therefore name main as the
    # triggering ref/SHA although the image was built from the release commit
    # (that commit is in the image's revision label and is what the checkout
    # built). Fixing it needs a custom provenance predicate or a run in the
    # release ref's context; neither is done here.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      # Push the attestation and cosign signature next to the image.
      packages: write
      # Required for cosign keyless signing and SLSA provenance attestations.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image with cosign (keyless)
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  preview-comment:
    name: Post preview pull command
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5
    # build-and-push only runs on pull_request for a labelled same-repo PR.
    # scan-image (an ancestor of build-and-push) is skipped on pull_request, and
    # an `if` without a status function implies success(), which is false when
    # any ancestor was skipped, so this job would be skipped even though the
    # preview was built. The explicit condition mirrors build-and-push.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.build-and-push.result == 'success'
    permissions:
      # Create or update the sticky preview comment on the PR.
      pull-requests: write
    steps:
      - name: Create or update the preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const number = context.issue.number;
            const image = process.env.IMAGE.toLowerCase();
            const digest = process.env.DIGEST;
            // metadata-action's short SHA is the first 7 characters.
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const tag = `pr-${number}`;
            const pinned = `${tag}-sha-${sha}`;
            const body = [
              MARKER,
              '### 🐳 Docker preview ready',
              '',
              `Built from ${sha} ([run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
              '',
              'Latest build of this PR:',
              '',
              '```bash',
              `docker pull ${image}:${tag}`,
              '```',
              '',
              'This exact commit:',
              '',
              '```bash',
              `docker pull ${image}:${pinned}`,
              '```',
              '',
              `Digest: \`${digest}\``,
              '',
              '> Run it with its own Discord application/token, a test guild and a throwaway MongoDB, never production.',
              '> This comment is updated on every rebuild. The images are deleted when the PR is closed.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }

  cleanup-preview:
    name: Delete PR preview image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on every same-repo PR close, labelled or not, so tags left behind
    # after the label was removed are still cleaned up. A PR with no preview
    # simply matches nothing.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Deleting a package version also needs the repository to hold the Admin
      # role on the package (package settings -> Manage Actions access).
      packages: write
      # Mark the sticky preview comment as removed.
      pull-requests: write
    steps:
      - name: Delete pr-<number> image versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prefix = `pr-${process.env.PR_NUMBER}`;
            const isPreviewTag = (t) => t === prefix || t.startsWith(`${prefix}-`);
            const owner = context.repo.owner;
            const isOrg = context.payload.repository.owner.type === 'Organization';
            const base = {
              package_type: 'container',
              package_name: context.repo.repo.toLowerCase(),
              ...(isOrg ? { org: owner } : { username: owner }),
            };
            const list = isOrg
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const remove = isOrg
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;

            const versions = await github.paginate(list, { ...base, state: 'active', per_page: 100 });
            // Only delete a version whose every tag belongs to this PR's
            // preview, so an image that also carries a release tag is never
            // touched.
            const previews = versions.filter((v) => {
              const tags = v.metadata?.container?.tags ?? [];
              return tags.length > 0 && tags.every(isPreviewTag);
            });
            if (!previews.length) {
              core.info(`No ${prefix} preview images to delete.`);
              return;
            }
            for (const v of previews) {
              core.info(`Deleting ${v.name} [${v.metadata.container.tags.join(', ')}]`);
              await remove({ ...base, package_version_id: v.id });
            }

      - name: Mark the preview comment as removed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- docker-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(MARKER));
            if (!existing) return;
            const body = [
              MARKER,
              '### 🐳 Docker preview removed',
              '',
              `The pr-${context.issue.number} preview images were deleted when this PR was closed.`,
              'Reopen the PR (with the `docker-preview` label still on) to build a new one.',
            ].join('\n');
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
