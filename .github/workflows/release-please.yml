name: Release Please

on:
  push:
    branches:
      - main

# One run at a time: two quick merges must not race on the release PR or on creating the
# tag and release. Queued runs wait (never cancel one that is mid-release); release-please
# works from the current state of main, so a replaced pending run loses nothing.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Use a PAT / GitHub App token (not the default GITHUB_TOKEN) so the
          # tag and release this action creates can trigger downstream
          # workflows — notably docker.yml's `on: push: tags`, which publishes
          # the semver-tagged container image. Tags pushed with the default
          # GITHUB_TOKEN are deliberately blocked from triggering other
          # workflows, which is why v1.0.0 shipped without a 1.0.0 image.
          # Falls back to GITHUB_TOKEN if the secret is unset (release still
          # works, but won't auto-build the image).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Build a preview image of the release candidate (#1094, #1278): the release PR is
      # the one PR nobody labels by hand, so its pr-<n> image would otherwise go stale.
      # Each push to main makes release-please update (force-push) the release branch,
      # a `synchronize` on a labelled PR, which docker.yml rebuilds.
      # `pr` is the JSON PullRequest object of the PR release-please created or updated
      # (action v5 output). It is unset when release-please touched no PR (run 617: "PR
      # #1074 remained the same"), and `!= ''` let that case through, so `fromJSON` in
      # the env block failed the job with "Error reading JToken". Gate on plain
      # truthiness and read the number in the script with `jq`, which also tolerates an
      # empty or malformed value. It reaches the script only through env, never
      # interpolated into it.
      # Do not add docker-preview to release-please-config.json's `label` option:
      # release-please uses that set to find its own pending PR.
      - name: Label the release PR docker-preview
        if: steps.release.outputs.pr
        env:
          # Must be the PAT: a label added with GITHUB_TOKEN does not trigger
          # docker.yml's `labeled` event, so no preview would be built.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice title=No release PR to label::release-please reported no pull request in this run, so there is nothing to label."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=RELEASE_PLEASE_TOKEN is not set::Skipping the docker-preview label on release PR #${PR_NUMBER}. Labels and pushes made with GITHUB_TOKEN do not trigger docker.yml, so the pr-${PR_NUMBER} preview image will not be built or refreshed."
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f 'labels[]=docker-preview' --silent
