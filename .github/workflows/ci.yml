name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests: one run per PR ref, a newer push cancels the older run.
# Everything else (push to main, workflow_dispatch): never cancel, and key the group on the
# commit SHA so runs for different commits never share a group. A shared group would still
# replace a *pending* run when a third merge arrives, so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least privilege; individual jobs opt in if needed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # Some npm versions silently drop the glibc/musl "libc" fields from
      # package-lock.json, which the Alpine image needs (#1087). Compare against
      # the PR's immutable base commit (not the moving tip of main); only
      # meaningful on pull requests.
      - name: Fetch base commit lockfile
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Check lockfile libc constraints
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:lockfile -- --base-ref "$BASE_SHA"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Temporary measurement for #1501 (Jest worker "ran out of memory" on Node 22): runner
      # memory and the V8 heap limit before the run, per-suite worker heap during it, and the
      # kernel OOM log after it. Removed or reduced once the cause is settled (evidence run 2).
      - name: Log runner memory (#1501)
        run: |
          nproc
          free -m
          node -p "const v8=require('v8');'node '+process.version+' heap_size_limit_mb='+Math.round(v8.getHeapStatistics().heap_size_limit/1048576)"

      - name: Run tests
        shell: bash
        run: npm run test:ci -- --logHeapUsage 2>&1 | tee "$RUNNER_TEMP/jest-output.log"

      - name: Log memory after tests (#1501)
        if: always()
        run: |
          free -m
          {
            echo "Worker heap per finished suite (MB), from --logHeapUsage:"
            grep -oE '\(([0-9]+) MB heap size\)' "$RUNNER_TEMP/jest-output.log" | grep -oE '[0-9]+' | sort -n | awk '{a[NR]=$1} END {if (NR) printf "suites=%d min=%d median=%d p90=%d max=%d over3000=%d\n", NR, a[1], a[int((NR+1)/2)], a[int(NR*0.9)], a[NR], c; else print "no heap lines"}' c="$(grep -oE '\(([0-9]+) MB heap size\)' "$RUNNER_TEMP/jest-output.log" | grep -oE '[0-9]+' | awk '$1>3000' | wc -l)"
            node -p "const v8=require('v8');'node '+process.version+' heap_size_limit_mb='+Math.round(v8.getHeapStatistics().heap_size_limit/1048576)"
            grep -E '^Time:' "$RUNNER_TEMP/jest-output.log" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          (sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -n 20) || echo "no kernel OOM lines readable"

      # Jest's coverageThreshold only catches coverage falling; this catches the
      # floors falling behind actual coverage and going stale (#848). Also writes
      # the actual-vs-floor table to the run summary on every PR.
      - name: Check coverage floor drift
        if: matrix.node == '22'
        run: npm run coverage:drift

      - name: Upload coverage artifact
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  # Real-MongoDB contract tests (#1106): the unit suite mocks mongoose, so it cannot
  # see Mongoose 9 rejecting a pipeline update or silently dropping a duplicate
  # index. Own job, Node 22 only, outside the coverage run.
  integration:
    name: Integration (MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        # TEMPORARY pin to MongoDB 7.0 (the app and Compose stay on 8). mongo:8.0 refuses to
        # start on Linux kernel >= 6.19 (SERVER-121912,
        # https://jira.mongodb.org/browse/SERVER-121912), which some GitHub-hosted runners
        # now ship. Return to an exact mongo:8.0.x tag once MongoDB ships a fix or runners
        # reach kernel >= 7.0.14. Tracked in lonix/koolbot#1269 (see #1264).
        image: mongo:7.0.45
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Log MongoDB image and server version
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'publish=27017' --format '{{.ID}}' | head -n 1)"
          image_ref="$(docker inspect --format '{{.Config.Image}}' "$cid")"
          image_id="$(docker inspect --format '{{.Image}}' "$cid")"
          repo_digest="$(docker image inspect --format '{{join .RepoDigests ", "}}' "$image_id" || true)"
          server_version="$(docker exec "$cid" mongosh --quiet --eval 'db.version()')"
          echo "MongoDB image: ${image_ref}"
          echo "MongoDB image id: ${image_id}"
          echo "MongoDB image digest: ${repo_digest:-n/a}"
          echo "MongoDB server version: ${server_version}"
          {
            echo "Integration MongoDB: ${server_version} (temporary pin, see #1269)"
            echo ""
            echo "- Image: \`${image_ref}\`"
            echo "- Digest: \`${repo_digest:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests
        run: npm run test:integration

  # Aggregator job to use as a single required status check in branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, integration]
    if: always()
    timeout-minutes: 1
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs succeeded."
