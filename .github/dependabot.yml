version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # TS 7.0 is blocked on typescript-eslint / ts-jest peer ranges; see #792.
      # Scoped to 7.0.x so Dependabot proposes 7.1 automatically, which is
      # upstream's target for native-API support.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]
    groups:
      # Group development dependencies together
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group production dependencies by update type
      production-minor:
        dependency-type: "production"
        update-types:
          - "minor"
      production-patch:
        dependency-type: "production"
        update-types:
          - "patch"
      # Batch all simultaneous security fixes into a single PR
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "dependencies"
      - "patch"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
