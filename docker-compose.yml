services:
  bot:
    # `latest` is the newest release. To upgrade on your own schedule, pin
    # `:X.Y.Z` (exact), `:X.Y` (fixes only) or `:X` (no new major); see
    # "Choosing an image tag" in the README. `:nightly` follows main (unreleased).
    image: ghcr.io/lonix/koolbot:latest
    container_name: koolbot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongodb
    stop_grace_period: 30s
    stop_signal: SIGTERM
    # The application code in the image is root-owned and the bot never writes
    # to disk (logs go to stdout), so the container filesystem can be read-only.
    # /tmp stays writable for Node and any library that wants scratch space.
    read_only: true
    tmpfs:
      - /tmp
    # Publish the bot's port 3000 on the HOST'S LOOPBACK ONLY, so /health and
    # (when WEBUI_ENABLED=true) the admin Web UI at /admin/* are reachable from
    # the machine itself, an SSH tunnel, or a reverse proxy on the host, and not
    # from the network (including a VPN address of the host).
    # Plain HTTP, no TLS: do not expose it publicly as-is. Set METRICS_TOKEN in
    # .env too, because /metrics is unauthenticated when it is empty.
    #
    # To reach it from other machines (LAN or VPN), change the line below to
    # "3000:3000" or to a specific interface IP such as "<vpn-ip>:3000:3000".
    # For internet-facing deployments use a reverse proxy (Caddy, nginx, Traefik)
    # and remove this publish — let the proxy forward to bot:3000 over the
    # internal Docker network. See WEBUI.md → "Docker Compose
    # recipes" for a complete Caddy example.
    ports:
      - "127.0.0.1:3000:3000"

  mongodb:
    image: mongo:8
    container_name: koolbot-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    # MongoDB is NOT published to the host. The bot reaches it over the
    # internal Docker network at mongodb:27017. The default mongo image
    # ships with NO authentication, so exposing 27017 to the host (and
    # potentially the public internet) would mean an unauthenticated
    # database open to anyone who can reach the host.
    #
    # If you need host-side access for debugging, add a localhost-only
    # publish — never bind 0.0.0.0:
    #   ports:
    #     - "127.0.0.1:27017:27017"
    stop_grace_period: 30s
    stop_signal: SIGTERM

volumes:
  mongodb_data:
